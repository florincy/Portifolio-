<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="MARÉ — avaliação — demonstração com dados fictícios"><title>MARÉ — avaliação — demonstração com dados fictícios</title><style>text{font-family:'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}</style><rect x="0" y="0" width="1200" height="800" rx="0" fill="#edf3f6" stroke="none"/><rect x="0" y="0" width="232" height="800" rx="0" fill="#082b40" stroke="none"/><text x="27" y="62" font-size="34" font-weight="800" fill="white" text-anchor="start">MARÉ</text><text x="27" y="91" font-size="14" font-weight="400" fill="#a6c6d4" text-anchor="start">Gestão de competências</text><text x="29" y="168" font-size="17" font-weight="600" fill="white" text-anchor="start">Visão geral</text><text x="29" y="232" font-size="17" font-weight="600" fill="#b5d2df" text-anchor="start">Supervisores</text><rect x="15" y="268" width="201" height="47" rx="7" fill="#174763" stroke="none"/><text x="29" y="296" font-size="17" font-weight="600" fill="#b5d2df" text-anchor="start">Avaliações</text><text x="29" y="360" font-size="17" font-weight="600" fill="#b5d2df" text-anchor="start">Desenvolvimento</text><text x="29" y="424" font-size="17" font-weight="600" fill="#b5d2df" text-anchor="start">Resultados</text><circle cx="50" cy="679" r="26" fill="#dceef4" stroke="none" stroke-width="1"/><text x="50" y="685" font-size="17" font-weight="700" fill="#347fc2" text-anchor="middle">D</text><text x="91" y="675" font-size="16" font-weight="600" fill="white" text-anchor="start">Conta demo</text><text x="91" y="700" font-size="13" font-weight="400" fill="#a6c6d4" text-anchor="start">Acesso ilustrativo</text><text x="269" y="51" font-size="14" font-weight="600" fill="#347fc2" text-anchor="start">DEMONSTRAÇÃO COM DADOS FICTÍCIOS</text><text x="269" y="100" font-size="33" font-weight="700" fill="#143548" text-anchor="start">Avaliação por competências</text><rect x="266" y="135" width="900" height="109" rx="12" fill="#ffffff" stroke="#dae5ea"/><text x="288" y="169" font-size="20" font-weight="600" fill="#143548" text-anchor="start"></text><circle cx="310" cy="186" r="26" fill="#dceef4" stroke="none" stroke-width="1"/><text x="310" y="192" font-size="17" font-weight="700" fill="#347fc2" text-anchor="middle">S01</text><text x="356" y="183" font-size="24" font-weight="700" fill="#143548" text-anchor="start">Supervisor 01</text><text x="356" y="212" font-size="16" font-weight="400" fill="#677f8c" text-anchor="start">Avaliador 01 · ciclo demonstrativo</text><rect x="266" y="268" width="900" height="424" rx="12" fill="#ffffff" stroke="#dae5ea"/><text x="288" y="302" font-size="20" font-weight="600" fill="#143548" text-anchor="start">Segurança nas operações</text><text x="295" y="343" font-size="17" font-weight="400" fill="#677f8c" text-anchor="start">Identifica riscos e aplica procedimentos de uma operação segura.</text><rect x="295" y="376" width="153" height="91" rx="8" fill="#f8fafb" stroke="#dae5ea"/><text x="371" y="413" font-size="24" font-weight="700" fill="#347fc2" text-anchor="middle">1</text><text x="371" y="445" font-size="14" font-weight="400" fill="#677f8c" text-anchor="middle">Não demonstrado</text><rect x="464" y="376" width="153" height="91" rx="8" fill="#f8fafb" stroke="#dae5ea"/><text x="540" y="413" font-size="24" font-weight="700" fill="#347fc2" text-anchor="middle">2</text><text x="540" y="445" font-size="14" font-weight="400" fill="#677f8c" text-anchor="middle">Insuficiente</text><rect x="633" y="376" width="153" height="91" rx="8" fill="#f8fafb" stroke="#dae5ea"/><text x="709" y="413" font-size="24" font-weight="700" fill="#347fc2" text-anchor="middle">3</text><text x="709" y="445" font-size="14" font-weight="400" fill="#677f8c" text-anchor="middle">Em evolução</text><rect x="802" y="376" width="153" height="91" rx="8" fill="#e5f1fb" stroke="#347fc2"/><text x="878" y="413" font-size="24" font-weight="700" fill="#347fc2" text-anchor="middle">4</text><text x="878" y="445" font-size="14" font-weight="400" fill="#677f8c" text-anchor="middle">Adequado</text><rect x="971" y="376" width="153" height="91" rx="8" fill="#f8fafb" stroke="#dae5ea"/><text x="1047" y="413" font-size="24" font-weight="700" fill="#347fc2" text-anchor="middle">5</text><text x="1047" y="445" font-size="14" font-weight="400" fill="#677f8c" text-anchor="middle">Consistente</text><text x="295" y="513" font-size="17" font-weight="600" fill="#143548" text-anchor="start">Evidência demonstrativa</text><rect x="295" y="531" width="839" height="68" rx="7" fill="#f8fafb" stroke="#dae5ea"/><text x="312" y="562" font-size="17" font-weight="400" fill="#677f8c" text-anchor="start">Participa do briefing e comunica os riscos previstos.</text><rect x="948" y="624" width="186" height="43" rx="7" fill="#347fc2" stroke="none"/><text x="1041" y="652" font-size="16" font-weight="600" fill="white" text-anchor="middle">Salvar avaliação</text><rect x="0" y="747" width="1200" height="53" rx="0" fill="#edf3f6" stroke="none"/><path d="M28,757 L1172,757" stroke="#dae5ea" stroke-width="1" fill="none"/><text x="30" y="782" font-size="14" font-weight="400" fill="#677f8c" text-anchor="start">Demonstração com dados fictícios · interface reconstruída para preservar a confidencialidade</text></svg>